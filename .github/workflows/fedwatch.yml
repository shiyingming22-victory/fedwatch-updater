name: fedwatch

on:
  schedule:
    # 08:30 UTC Mon-Fri = 04:30 ET (EDT) / 03:30 ET (EST), before the EOD pull
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests
      - name: Fetch FedWatch data
        run: python fedwatch.py
      - name: Commit and push
        run: |
          git config user.name "fedwatch-bot"
          git config user.email "fedwatch-bot@users.noreply.github.com"
          git add fedwatch.json
          git diff --cached --quiet || git commit -m "update fedwatch $(date -u +%F)"
          git push
